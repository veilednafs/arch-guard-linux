[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arch-guard-linux"
version = "0.1.0"
description = "Local-first host and network security monitor for Arch Linux"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

[project.scripts]
arch-guard = "arch_guard.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
